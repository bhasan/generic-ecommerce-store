# Production Nginx Configuration
# /etc/nginx/conf.d/default.conf

# Structured JSON access log — makes every field queryable in Loki without regex.
# $request_id ties this line to the matching backend log entry (X-Request-Id header).
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$request_id",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
  '}';

# NOTE: We intentionally do NOT use a static `upstream { server backend:3000; }`
# block here. nginx resolves upstream server names once, at startup, so if the
# backend container isn't registered in Docker's DNS at that instant nginx aborts
# with "host not found in upstream". Instead we resolve `backend` at request time
# via Docker's embedded DNS (see `resolver` + variable `proxy_pass` below), which
# lets web start even if backend is briefly down and re-resolve on recreation.

# HTTP server - redirect to HTTPS (uncomment if using SSL)
# server {
#     listen 80;
#     server_name your-domain.com www.your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

# Main server block
server {
    listen 80;
    # Listen on IPv6 too. The nginx image normally adds this via its
    # 10-listen-on-ipv6-by-default.sh entrypoint, but that script can't patch
    # this file because we mount it read-only (:ro). Without it, the container
    # healthcheck (wget http://localhost -> ::1) gets connection refused.
    listen [::]:80;
    # Docker's embedded DNS, used to resolve `backend` at request time (see /api).
    # valid=10s re-resolves periodically so a recreated backend (new IP) is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Restore real client IP when traffic is proxied through Cloudflare.
    # Keep this list aligned with https://www.cloudflare.com/ips/
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Uncomment and configure for HTTPS:
    # listen 443 ssl;
    # http2 on;
    # server_name your-domain.com www.your-domain.com;
    
    # SSL Configuration (uncomment if using SSL)
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Uncomment if using HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Explicitly block external access to the backend metrics endpoint.
    location = /metrics {
        deny all;
    }

    # API proxy (allow 10MB for file uploads)
    client_max_body_size 10M;
    location /api {
        # Resolve backend at request time via the resolver above (variable in
        # proxy_pass defers DNS to runtime, so nginx won't fail to start if the
        # backend is momentarily unavailable).
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }

    # React App - static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        
        # React Router support
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    access_log /var/log/nginx/access.log json_combined;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

