# /etc/nginx/conf.d/default.conf

# Structured JSON access log — consistent with production, makes Loki queries work the same in both envs.
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$request_id",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
  '}';

# 1. Define the upstream 'backend' service
# 'backend' is the service name from docker-compose.yml
# '3000' is the port 'backend' exposes *inside* the network
upstream backend {
  server backend:3000;
}

# 2. The main server block
server {
  listen 80;
  # Restore real client IP when requests come through Cloudflare.
  # Keep this list aligned with https://www.cloudflare.com/ips/
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;

  access_log /var/log/nginx/access.log json_combined;

  # Explicitly block external access to the backend metrics endpoint.
  # /metrics is not proxied by any other location block, but this makes
  # the intent unambiguous and prevents future config drift.
  location = /metrics {
    deny all;
  }

  # 3. Location block for API calls
  # Any request starting with /api/ will be proxied
  location /api {
    proxy_pass http://backend; # Forward to the 'upstream'
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Timeouts and buffering
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
  }

  # 4. Location block for the React App
  # This serves your static files
  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    
    # This is the "magic" for React Router
    # It tries the file, then a directory, then falls back to /index.html
    try_files $uri $uri/ /index.html;
  }
}
