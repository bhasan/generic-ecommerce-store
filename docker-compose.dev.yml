services:
  db:
    container_name: generic-ecommerce-store-db
    ports:
      - "15432:5432"

  backend:
    container_name: generic-ecommerce-store-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      # Dev override: base compose sets CORS_ORIGIN from the root .env (a prod
      # placeholder). Card payments build the Authorize.Net iframe communicator URL
      # from CORS_ORIGIN, so it must point at the dev frontend origin. Authorize.Net
      # requires https://, so for local card-payment testing set DEV_CORS_ORIGIN to
      # an https tunnel (e.g. cloudflared) pointing at the frontend.
      CORS_ORIGIN: ${DEV_CORS_ORIGIN:-http://localhost:5843}
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      - ./backend/package.json:/app/package.json:ro
      - ./backend/package-lock.json:/app/package-lock.json:ro
      - /app/node_modules

  web-dev:
    image: node:20-alpine
    container_name: generic-ecommerce-store-web-dev
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      # Vite dev server listens on 5843 (see web/vite.config.js server.port)
      - "5843:5843"
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    networks:
      - sshtx_network
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend
