services:
  db:
    container_name: smoke-station-delivery-db
    ports:
      - "5432:5432"

  backend:
    container_name: smoke-station-delivery-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      - ./backend/package.json:/app/package.json:ro
      - ./backend/package-lock.json:/app/package-lock.json:ro
      - /app/node_modules

  web-dev:
    image: node:20-alpine
    container_name: smoke-station-delivery-web-dev
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    networks:
      - sshtx_network
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend
