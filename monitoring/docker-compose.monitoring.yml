name: smoke-station-monitoring

services:
  promtail:
    image: grafana/promtail:3.0.0
    container_name: smoke-station-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_URL: ${LOKI_URL}
      LOKI_USERNAME: ${LOKI_USERNAME}
      LOKI_PASSWORD: ${LOKI_PASSWORD}
    networks:
      - sshtx_network
    mem_limit: 64m
    mem_reservation: 32m

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: smoke-station-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./monitoring/prometheus/entrypoint.sh:/entrypoint.sh:ro
      - prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL}
      PROMETHEUS_USERNAME: ${PROMETHEUS_USERNAME}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD}
    networks:
      - sshtx_network
    mem_limit: 256m
    mem_reservation: 128m

volumes:
  prometheus-data:

networks:
  sshtx_network:
    external: true
    name: smoke-station-delivery_sshtx_network
