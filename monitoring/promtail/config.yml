server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}/loki/api/v1/push
    basic_auth:
      username: ${LOKI_USERNAME}
      password: ${LOKI_PASSWORD}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use container name as the stream label
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      # Tag all logs with the app name
      - target_label: app
        replacement: smoke-station-delivery
      # Tag with compose service name when available
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Drop containers with no logs (exited)
      - source_labels: [__meta_docker_container_state]
        regex: running
        action: keep
    pipeline_stages:
      # Parse structured JSON logs from the backend
      - json:
          expressions:
            level: level
            message: message
      - labels:
          level:
