services:
  # Shared base service definitions. Always layer this file with either
  # docker-compose.dev.yml for local development or docker-compose.prod.yml for production.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-backend_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-smoke-station-delivery-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sshtx_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-backend_user} -d ${DB_NAME:-smoke-station-delivery-db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-backend_user}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-smoke-station-delivery-db}"
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ONLINE_STORE_REPORTING_API_ENABLED: ${ONLINE_STORE_REPORTING_API_ENABLED:-false}
      ONLINE_STORE_REPORTING_API_TOKEN: ${ONLINE_STORE_REPORTING_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sshtx_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - sshtx_network
    healthcheck:
      # Use 127.0.0.1 (not localhost) so the check forces IPv4 and never depends
      # on nginx listening on IPv6 ::1. Hit the dedicated /health endpoint.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sshtx_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
