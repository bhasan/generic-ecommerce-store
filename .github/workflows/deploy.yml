name: Deploy to VPS

on:
  push:
    branches:
      - feature/notification_connection
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            git fetch origin
            git checkout feature/notification_connection
            git pull --ff-only origin feature/notification_connection

            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d

            docker exec smoke-station-delivery-backend-prod npx prisma migrate deploy || true

            curl -fsS http://localhost/api/health
            docker ps --format "table {{.Names}}\t{{.Status}}"
