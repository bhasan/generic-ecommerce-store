# Production stack. Requires env vars in .env.prod: DB_USER, DB_PASSWORD, DB_NAME, JWT_SECRET, CORS_ORIGIN.
#
# First-time deployment (recommended): copy full project to target, then build and run there.
# See PRODUCTION_DEPLOYMENT.md "First-time deployment (build on target)".
services:
  # 1. The PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: smoke-station-delivery-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - sshtx_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. The Express.js Backend Service
  backend:
    image: smoke-station-delivery/backend:latest
    container_name: smoke-station-delivery-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      PORT: 3000
      NODE_ENV: "production"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sshtx_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 3. The Nginx/React Frontend Service
  web:
    image: smoke-station-delivery/web:latest
    container_name: smoke-station-delivery-web-prod
    build: 
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    networks:
      - sshtx_network
    volumes:
      # Mount SSL certificates if using HTTPS
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Mount custom nginx config if needed
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 4. Cloudflare Dynamic DNS (updates DNS records when host IP changes)
  cloudflare-ddns:
    image: timothyjmiller/cloudflare-ddns:latest
    container_name: smoke-station-delivery-cloudflare-ddns
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.prod
    environment:
      - CF_DDNS_API_TOKEN=${CF_DDNS_API_TOKEN}
      - CF_DDNS_ZONE_ID=${CF_DDNS_ZONE_ID}
    volumes:
      - ./cloudflare-ddns/config.json:/config.json

# Define the shared network
networks:
  sshtx_network:
    driver: bridge

# Define the named volume for data persistence
volumes:
  postgres_data_prod:
    driver: local

