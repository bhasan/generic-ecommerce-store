services:
  db:
    container_name: smoke-station-delivery-db-prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  backend:
    image: smoke-station-delivery/backend:latest
    container_name: smoke-station-delivery-backend-prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      GENERAL_RATE_LIMIT_MAX: ${GENERAL_RATE_LIMIT_MAX:-100}
      GENERAL_RATE_LIMIT_WINDOW_MS: ${GENERAL_RATE_LIMIT_WINDOW_MS:-900000}
      POLL_RATE_LIMIT_MAX: ${POLL_RATE_LIMIT_MAX:-240}
      POLL_RATE_LIMIT_WINDOW_MS: ${POLL_RATE_LIMIT_WINDOW_MS:-900000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      REQUEST_IP_DEBUG_SAMPLE_SIZE: ${REQUEST_IP_DEBUG_SAMPLE_SIZE:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Deployment-managed env (Hostinger/.env.prod) must be runtime source of truth.
      MAKE_API_KEY: ${MAKE_API_KEY}
      MAKE_WEBHOOK_URL: ${MAKE_WEBHOOK_URL:-}
      MAKE_NOTIFICATION_WEBHOOK_URL: ${MAKE_NOTIFICATION_WEBHOOK_URL:-}
      MAKE_NOTIFICATION_WEBHOOK_URL_ORDERS: ${MAKE_NOTIFICATION_WEBHOOK_URL_ORDERS:-}
      MAKE_NOTIFICATION_WEBHOOK_URL_AUTH: ${MAKE_NOTIFICATION_WEBHOOK_URL_AUTH:-}
      MAKE_NOTIFICATION_WEBHOOK_URL_CONTACT: ${MAKE_NOTIFICATION_WEBHOOK_URL_CONTACT:-}
      MAKE_NOTIFICATION_WEBHOOK_URL_DRIVER: ${MAKE_NOTIFICATION_WEBHOOK_URL_DRIVER:-}
      MAKE_NOTIFICATION_WEBHOOK_URL_ADMIN: ${MAKE_NOTIFICATION_WEBHOOK_URL_ADMIN:-}
    volumes:
      - uploads_data_prod:/app/uploads

  web:
    image: smoke-station-delivery/web:latest
    container_name: smoke-station-delivery-web-prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: nginx/Dockerfile
      network: host
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # Optional: Cloudflare Dynamic DNS
  # cloudflare-ddns:
  #   image: timothyjmiller/cloudflare-ddns:latest
  #   container_name: smoke-station-delivery-cloudflare-ddns
  #   restart: unless-stopped
  #   network_mode: host
  #   security_opt:
  #     - no-new-privileges:true
  #   env_file:
  #     - .env.prod
  #   environment:
  #     CF_DDNS_API_TOKEN: ${CF_DDNS_API_TOKEN}
  #     CF_DDNS_ZONE_ID: ${CF_DDNS_ZONE_ID}
  #   volumes:
  #     - ./cloudflare-ddns/config.json:/config.json

volumes:
  postgres_data_prod:
    driver: local
  uploads_data_prod:
    driver: local
